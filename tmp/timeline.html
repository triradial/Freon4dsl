<!DOCTYPE HTML>
          <html>
          <head>
          
      <title>Timeline Chart</title>
      <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
      <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
      <link id="theme-stylesheet" rel='stylesheet' href='/assets/styles/bundle-dark.css'>
       <!--    -->
      </head>
      <body>
      <div id="visualization" style="position: unset !important; height:auto"></div>  
      <div class="timeline-instructions">
        <ul style="list-style-type: none;">
            <li>Use mouse scroll wheel or touchpad to zoom in/out of the timeline </li>
            <li>When zoomed in, hold mouse pointer down and drag to move forward or backward through the timeline</li>
        </ul>
        <div class="timeline-key">
            <div class="key-item"><div class="square scheduled-event"></div><span>Scheduled time of an Event/Visit</span></div>
            <div class="key-item"><div class="square window"></div><span>Window before and after a Scheduled Event/Visit</span></div>
            
            
        </div>
    </div>
      <script>
        var groups = new vis.DataSet([
            { "content": "<b>Phase</b>", "id": "Phase", className: 'phase' },
            { "content": "Screen", "id": "Screen" },
{ "content": "Visit 1", "id": "Visit 1" },
{ "content": "Visit 2", "id": "Visit 2" },
            
            
          ]);

        var items = new vis.DataSet([
            { start: new Date(2024, 00, 01, 00, 00, 00), end: new Date(2024, 03, 21, 23, 59, 59), group: "Phase", className: "screening-phase", title: "Day: 0", content: "<b>Screening</b>", id: "Screening0" },
            
{ start: new Date(2024, 00, 01, 00, 00, 00), end: new Date(2024, 00, 01, 23, 59, 59), group: "Screen", className: "scheduled-event", title: "Screen:  as the start day of the study", content: "&nbsp;", id: "Screen1" },


{ start: new Date(2024, 00, 22, 00, 00, 00), end: new Date(2024, 00, 22, 23, 59, 59), group: "Visit 1", className: "scheduled-event", title: "Visit 1: when Screen completed + 3 weeks", content: "&nbsp;", id: "Visit 12" },


{ start: new Date(2024, 03, 21, 00, 00, 00), end: new Date(2024, 03, 21, 23, 59, 59), group: "Visit 2", className: "scheduled-event", title: "Visit 2: when Visit 1 completed + 3 months", content: "&nbsp;", id: "Visit 23" },

                
            

            
          ])

// create visualization
var container = document.getElementById('visualization');
    var options = {
      showCurrentTime: false,
      format: {
          minorLabels: {
              millisecond:'',
              second:     '',
              minute:     '',
              hour:       '',
              weekday:    '',
              day:        'DDD',
              week:       '',
              month:      '',
              year:       ''
          },
          majorLabels: {
              millisecond:'',
              second:     '',
              minute:     '',
              hour:       '',
              weekday:    '',
              day:        'w',
              week:       '',
              month:      '',
              year:       ''
          }

      },
      timeAxis: {scale: 'day', step: 1},
      showMajorLabels: true,
      orientation: 'both',
      start: new Date(2024, 0, 1),
      end: new Date(2024, 3, 22),
      min: new Date(2024, 0, 1),
      max: new Date(2024, 3, 22),
      zoomFriction:30,
      margin: {
          item: {
              horizontal: 0,
          },
      },
  };

        var timeline = new vis.Timeline(container);
        timeline.setOptions(options);
        timeline.setGroups(groups);
        timeline.setItems(items);
      </script>
    
          </body>
          </html>
