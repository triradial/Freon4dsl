name: Build/Deploy Server

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install all dependencies
        run: npm install --workspaces
        working-directory: .

      - name: Build all packages using TypeScript project references
        run: npm run build
        working-directory: .
        env:
          DEBUG: "*" 

      # Add this preparation step
      - name: Prepare server deployment
        run: |
          # Create deployment directory
          mkdir -p server-deploy
          
          # Copy package.json and lock files
          cp packages/server/package.json server-deploy/
          cp package-lock.json server-deploy/
          
          # Install production dependencies in deployment directory
          cd server-deploy
          npm install --omit=dev --workspace=@freon4dsl/server
          
          # Copy server dist files
          mkdir -p dist/server
          cp -r ../packages/server/dist/server/* dist/server/
          cp ../packages/server/web.config .
          
          # Install workspace dependencies
          npm install --omit=dev @freon4dsl/core@0.7.0-beta5
          npm install --omit=dev @freon4dsl/samples-study-configuration@0.7.0-beta5
          
          # Verify deployment contents
          echo "Deployment package contents:"
          ls -la
          echo "Server directory contents:"
          ls -la dist/server
          
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server-app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: server-app

      # Verification step is correctly placed here
      - name: Verify deployment files
        run: |
          echo "Checking deployment structure..."
          test -d server-app/node_modules || (echo "node_modules missing" && exit 1)
          test -f server-app/web.config || (echo "web.config missing" && exit 1)
          test -f server-app/package.json || (echo "package.json missing" && exit 1)
          test -f server-app/dist/server/start.cjs || (echo "start.cjs missing" && exit 1)
          test -f server-app/dist/server/server-starter.js || (echo "server-starter.js missing" && exit 1)
          
          echo "Checking dependencies..."
          test -d server-app/node_modules/@freon4dsl/core || (echo "@freon4dsl/core missing" && exit 1)
          test -d server-app/node_modules/@freon4dsl/samples-study-configuration || (echo "@freon4dsl/samples-study-configuration missing" && exit 1)
          
          echo "All required files and dependencies present"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID }}","clientSecret":"${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID }}"}'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'crchub-server'
          package: server-app