name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install dependencies with workspace support from root
      - name: Install all dependencies
        run: npm install --workspaces
        working-directory: . # Install from the root to link dependencies

      # Compile all packages using project references
      - name: Build all packages using TypeScript project references
        run: |
          npm run build
          tsc -p packages/samples/UnusedOrInvalid/RulesLanguage/tsconfig.json --noEmit
          tsc -p packages/webapp-crchub/amplify/tsconfig.json --noEmit
        working-directory: .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: packages/server  # Upload only server package contents for deployment

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'crchub-server'
          slot-name: 'Production'
          package: './packages/server' # Ensure only server package is deployed
