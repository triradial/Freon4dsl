name: Build/Deploy Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy to'
        required: true
        type: choice
        options:
          - Development
          
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install all dependencies
        run: npm install --workspaces
        working-directory: .

      - name: Build all packages using TypeScript project references
        run: npm run build
        working-directory: .
        env:
          DEBUG: "*"

      - name: Prepare server deployment
        run: |
          # Create deployment directory
          mkdir -p server-app
          
          # Copy package.json and modify for production
          cp packages/server-crchub/package.json server-app/
          node -e '
            const pkg = require("./server-app/package.json");
            pkg.scripts.start = "node dist/server/server-starter.js";
            require("fs").writeFileSync("./server-app/package.json", JSON.stringify(pkg, null, 2));
          '
          
          # Rest of your existing preparation steps...
          cp package-lock.json server-app/
          
          # Create a temporary local package directory
          mkdir -p server-app/local-packages
          cp -r packages/core/dist server-app/local-packages/core
          cp -r packages/languages/study-configuration/dist server-app/local-packages/study-configuration
          
          # Install production dependencies
          cd server-app
          npm install --omit=dev
          
          # Copy server dist files
          mkdir -p dist/server
          mkdir -p dist/config
          mkdir -p dist/storage
          cp -r ../packages/server-crchub/dist/server/* dist/server/
          cp -r ../packages/server-crchub/dist/config/* dist/config/
          cp -r ../packages/server-crchub/dist/storage/* dist/storage/
          
          # Install local workspace dependencies
          npm install --omit=dev ../packages/core
          npm install --omit=dev ../packages/languages/study-configuration

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server-app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'Development' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID }}","clientSecret":"${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID }}"}'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: server-app

      - name: Verify deployment files
        run: |
          echo "Checking deployment structure..."
          test -d server-app/node_modules || (echo "node_modules missing" && exit 1)
          test -f server-app/package.json || (echo "package.json missing" && exit 1)
          test -f server-app/dist/server/server-starter.js || (echo "server-starter.js missing" && exit 1)
          
          echo "Checking dependencies..."
          test -d server-app/node_modules/@freon4dsl/core || (echo "@freon4dsl/core missing" && exit 1)
          test -d server-app/node_modules/@freon4dsl/study-configuration || (echo "@freon4dsl/study-configuration missing" && exit 1)
          
          echo "All required files and dependencies present"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ vars.AZURE_SERVER_NAME }}
          package: server-app

      - name: Configure App Settings
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config appsettings set --name ${{ vars.AZURE_SERVER_NAME }} \
                                             --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                                             --settings AZURE_ENVIRONMENT=${{ vars.AZURE_ENVIRONMENT }} \
                                                       PORT=8080
