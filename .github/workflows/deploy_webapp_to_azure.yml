name: Build/Deploy WebApp

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy to'
        required: true
        type: choice
        options:
          - Development

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install all dependencies
        run: npm install --workspaces
        working-directory: .

      - name: Build all packages using TypeScript project references
        run: npm run build
        working-directory: .
        env:
          DEBUG: "*"
          AZURE_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}

      - name: Prepare webapp deployment
        run: |
          # Create deployment directory
          mkdir -p webapp-app
          
          # Copy SvelteKit build output (adapter-node produces build/ with index.js server)
          cp -r packages/webapp-crchub/build webapp-app/
          
          # Create minimal package.json for production
          cp packages/webapp-crchub/package.json webapp-app/
          node -e '
            const pkg = require("./webapp-app/package.json");
            pkg.scripts.start = "node build/index.js";
            pkg.dependencies = {};
            pkg.devDependencies = {};
            delete pkg.engines;
            require("fs").writeFileSync("./webapp-app/package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: webapp-app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'Development' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID }}","clientSecret":"${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID }}"}'
  
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: webapp-app

      - name: Verify deployment files
        run: |
          echo "Checking deployment structure..."
          test -f webapp-app/package.json || (echo "package.json missing" && exit 1)
          test -f webapp-app/build/index.js || (echo "build/index.js missing" && exit 1)
          test -d webapp-app/build/client || (echo "build/client directory missing" && exit 1)
          
          echo "All required files present"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: webapp-app

      - name: Configure App Settings
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config appsettings set --name ${{ vars.AZURE_WEBAPP_NAME }} \
                                             --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                                             --settings AZURE_ENVIRONMENT=${{ vars.AZURE_ENVIRONMENT }} \
                                                       PORT=8080
