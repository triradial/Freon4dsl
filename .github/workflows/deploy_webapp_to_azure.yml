name: Build/Deploy WebApp

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy to'
        required: true
        type: choice
        options:
          - Development

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install all dependencies
        run: npm install --workspaces
        working-directory: .

      - name: Build all packages using TypeScript project references
        run: npm run build
        working-directory: .
        env:
          DEBUG: "*"
          AZURE_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}

      - name: Prepare webapp deployment
        run: |
          # Create deployment directory
          mkdir -p webapp-app
          
          # Copy package.json and modify for production
          cp packages/webapp-crchub/package.json webapp-app/
          node -e '
            const pkg = require("./webapp-app/package.json");
            pkg.scripts.start = "node node_modules/sirv-cli/bin.js public --port 8080 --single --host 0.0.0.0";
            const { dependencies } = pkg;
            pkg.dependencies = dependencies;
            require("fs").writeFileSync("./webapp-app/package.json", JSON.stringify(pkg, null, 2));
          '

          # Rest of your existing preparation steps...
          cp package-lock.json webapp-app/

          # Copy dependencies
          mkdir -p webapp-app/local-packages
          cp -r packages/core/dist webapp-app/local-packages/core
          cp -r packages/core-svelte/dist webapp-app/local-packages/core-svelte
          cp -r packages/languages/study-configuration/dist webapp-app/local-packages/study-configuration
         
          # Copy built webapp files
          cp -r packages/webapp-crchub/public webapp-app/

          # Install production dependencies
          cd webapp-app
          npm install --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: webapp-app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'Development' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID }}","clientSecret":"${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID }}"}'
  
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: webapp-app

      - name: Verify deployment files
        run: |
          echo "Checking deployment structure..."
          test -d webapp-app/node_modules || (echo "node_modules missing" && exit 1)
          test -f webapp-app/package.json || (echo "package.json missing" && exit 1)
          test -d webapp-app/public || (echo "public directory missing" && exit 1)
          
          echo "All required files present"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: webapp-app

      - name: Configure App Settings
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config appsettings set --name ${{ vars.AZURE_WEBAPP_NAME }} \
                                             --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                                             --settings AZURE_ENVIRONMENT=${{ vars.AZURE_ENVIRONMENT }} \
                                                       PORT=8080
